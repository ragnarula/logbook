services:
  tracker:
    build: ../tracker
    container_name: tracker
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      # Set TRACKER_PASSCODE in .env to require a passcode. Leave it empty and
      # the service stays open, which is correct behind a private network.
      # Changing it does not sign existing devices out; delete rows from the
      # sessions table for that.
      - TRACKER_PASSCODE=${TRACKER_PASSCODE:-}
    volumes:
      - ${APPDATA}/tracker:/data
    networks:
      - egadd-net

networks:
  egadd-net:
    external: true
